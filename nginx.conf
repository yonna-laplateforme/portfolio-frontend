server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    add_header Content-Security-Policy "default-src 'self'; 
    script-src 'self' https://upload-widget.cloudinary.com https://widget.cloudinary.com 'unsafe-inline' 'unsafe-eval'; 
    style-src 'self' 'unsafe-inline'; 
    img-src 'self' https://res.cloudinary.com data: blob:; 
    media-src 'self' https://res.cloudinary.com blob:; 
    frame-src https://upload-widget.cloudinary.com; 
    connect-src 'self' https://api.cloudinary.com https://res.cloudinary.com https://api.www-yonnamerlini.com;";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}